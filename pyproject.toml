[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "clonact"
version = "1.0.0"
description = "ClonAct: Scheduling Context Blocks as Resources for Always-On Personal Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Xufei Tian" },
  { name = "Han Hu", email = "han.hu@mail.ecust.edu.cn" },
  { name = "Wenli Du", email = "wldu@ecust.edu.cn" },
]
dependencies = [
  "httpx>=0.27.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.6.0",
  "psycopg2-binary>=2.9.9",
  "numpy>=1.26.0",
  "typesafe-sdk==0.7.5",
]

[project.optional-dependencies]
data = ["pyarrow>=17.0.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = [
  "clonact*",
  "dsh_runner*",
  "sandbox_world*",
  "synaptic_bench_150*",
  "appworld_micro_30*",
  "synaptic_stream_60*",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
synaptic_bench_150 = ["release.json", "frozen_evidence.json", "upstream_lock.json", "data/dataset_lock.json", "data/pa60_manifest.json"]
appworld_micro_30 = ["release.json", "data/source_lock.json", "data/micro30_recipe_manifest.json"]
synaptic_stream_60 = ["release.json", "data/manifest_60.json"]
dsh_runner = ["package.json", "pnpm-lock.yaml", "synaptic_worker_plugin/*.mjs", "synaptic_worker_plugin/*.yml", "synaptic_worker_plugin/package.json"]

[tool.setuptools]
include-package-data = false

[project.urls]
Paper = "https://arxiv.org/abs/2611.26346"
Repository = "https://github.com/Viacol0916/ClonAct"
Blog = "https://viacol.pages.dev/blog/context-as-a-resource/"
